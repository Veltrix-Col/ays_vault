services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - gh_token
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      DB_ENGINE: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      FIELD_FINGERPRINT_KEY: ${FIELD_FINGERPRINT_KEY}
      OFFICE_START: ${OFFICE_START:-07:00}
      OFFICE_END: ${OFFICE_END:-18:00}
      ALERT_EMAIL: ${ALERT_EMAIL}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      ALERT_EMAIL_BACKEND: ${ALERT_EMAIL_BACKEND:-smtp}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM}
      ALERT_EMAIL_ADMIN: ${ALERT_EMAIL_ADMIN}
      ALERT_EMAIL_LEADER: ${ALERT_EMAIL_LEADER}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.office365.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      MS_GRAPH_TENANT_ID: ${MS_GRAPH_TENANT_ID}
      MS_GRAPH_CLIENT_ID: ${MS_GRAPH_CLIENT_ID}
      MS_GRAPH_CLIENT_SECRET: ${MS_GRAPH_CLIENT_SECRET}
      MS_GRAPH_SENDER: ${MS_GRAPH_SENDER}
      EMAIL_TIMEOUT_SECONDS: ${EMAIL_TIMEOUT_SECONDS:-10}
      EMAIL_MAX_RETRIES: ${EMAIL_MAX_RETRIES:-3}
      VAULT_BASE_URL: ${VAULT_BASE_URL}
      COLECTIVOS_EXTERNAL_BASE_URL: ${COLECTIVOS_EXTERNAL_BASE_URL}
      COLECTIVOS_RENEWAL_INTERNAL_ALERT_EMAIL: ${COLECTIVOS_RENEWAL_INTERNAL_ALERT_EMAIL}
      SOAT_APP_URL: ${SOAT_APP_URL}
      SOAT_ZOHO_REPORT_URL: ${SOAT_ZOHO_REPORT_URL}
      SOAT_MAX_UPLOAD_BYTES: ${SOAT_MAX_UPLOAD_BYTES:-26214400}
      SOAT_MAX_ROWS: ${SOAT_MAX_ROWS:-100000}
      SOAT_MAX_COLUMNS: ${SOAT_MAX_COLUMNS:-200}
      CONCILIACION_COBRO_PREFILL_ENABLED: ${CONCILIACION_COBRO_PREFILL_ENABLED:-false}
      REPORT_XLSX_MAX_ROWS: ${REPORT_XLSX_MAX_ROWS:-5000}
      REPORT_PDF_MAX_ROWS: ${REPORT_PDF_MAX_ROWS:-1000}
      REPORT_DEFAULT_MAX_DAYS: ${REPORT_DEFAULT_MAX_DAYS:-90}
      REPORT_LARGE_EXPORT_ALERT_THRESHOLD: ${REPORT_LARGE_EXPORT_ALERT_THRESHOLD:-1000}
      SESSION_INACTIVITY_SECONDS: ${SESSION_INACTIVITY_SECONDS:-600}
      SESSION_ACTIVITY_THROTTLE_SECONDS: ${SESSION_ACTIVITY_THROTTLE_SECONDS:-60}
      REAUTH_TTL_SECONDS: ${REAUTH_TTL_SECONDS:-300}
      MFA_FAILURE_LIMIT: ${MFA_FAILURE_LIMIT:-5}
      MFA_ISSUER: ${MFA_ISSUER:-A&S Vault}
      TOOLS_ACCESS_MODE: ${TOOLS_ACCESS_MODE:-trusted_intranet}
      TOOLS_DELEGATED_ACCESS_VALIDATOR: ${TOOLS_DELEGATED_ACCESS_VALIDATOR:-intranet_sso.delegated_access.validate_intranet_session}
      INTRANET_SSO_PUBLIC_KEY: ${INTRANET_SSO_PUBLIC_KEY}
      INTRANET_SSO_AUTHORIZE_URL: ${INTRANET_SSO_AUTHORIZE_URL}
      INTRANET_SSO_AUDIENCE: ${INTRANET_SSO_AUDIENCE:-bapps.dp.segurosays.com}
      INTRANET_SSO_ISSUER: ${INTRANET_SSO_ISSUER:-segurosays.com}
      AZURE_FOUNDRY_RECIBO_KEY: ${AZURE_FOUNDRY_RECIBO_KEY}
      AZURE_FOUNDRY_RECIBO_ENDPOINT: ${AZURE_FOUNDRY_RECIBO_ENDPOINT:-https://ays-cu-renovaciones-dev.services.ai.azure.com/openai/v1}
      AZURE_FOUNDRY_RECIBO_MODEL: ${AZURE_FOUNDRY_RECIBO_MODEL:-gpt-5.6-luna}
      # "Acceso publico interno" de Colectivos (bypass temporal de QA sobre el
      # gate de intranet SSO -- ver config/middleware.py). Sin este passthrough
      # el default de settings.py (True) queda fijo y el modulo interno de
      # Colectivos no exige login. Se sobreescribe el default aqui a "false"
      # porque este compose es el de produccion; para reabrirlo puntualmente
      # hay que setearlo explicito en Dokploy, nunca deberia quedar en true
      # por omision en produccion.
      COLECTIVOS_INTERNAL_PUBLIC_ACCESS: ${COLECTIVOS_INTERNAL_PUBLIC_ACCESS:-false}
      COLECTIVOS_TASK_PUBLISH_ENABLED: ${COLECTIVOS_TASK_PUBLISH_ENABLED:-false}
      COLECTIVOS_TASK_WRITE_CONFIRMATION: ${COLECTIVOS_TASK_WRITE_CONFIRMATION}
      COLECTIVOS_CONTACT_PUBLISH_ENABLED: ${COLECTIVOS_CONTACT_PUBLISH_ENABLED:-false}
      COLECTIVOS_CONTACT_WRITE_CONFIRMATION: ${COLECTIVOS_CONTACT_WRITE_CONFIRMATION}
      COLECTIVOS_SUBRISK_PUBLISH_ENABLED: ${COLECTIVOS_SUBRISK_PUBLISH_ENABLED:-false}
      COLECTIVOS_SUBRISK_WRITE_CONFIRMATION: ${COLECTIVOS_SUBRISK_WRITE_CONFIRMATION}
      COLECTIVOS_RISK_PUBLISH_ENABLED: ${COLECTIVOS_RISK_PUBLISH_ENABLED:-false}
      COLECTIVOS_RISK_WRITE_CONFIRMATION: ${COLECTIVOS_RISK_WRITE_CONFIRMATION}
      COLECTIVOS_ATTACHMENT_PUBLISH_ENABLED: ${COLECTIVOS_ATTACHMENT_PUBLISH_ENABLED:-false}
      COLECTIVOS_ATTACHMENT_WRITE_CONFIRMATION: ${COLECTIVOS_ATTACHMENT_WRITE_CONFIRMATION}
      # Confirmaciones de escritura por perfil Zoho (sandbox/production), una
      # por recurso. Sin este passthrough quedan vacías dentro del contenedor
      # aunque Dokploy las tenga configuradas, porque docker-compose solo
      # inyecta a runtime las claves listadas explícitamente aquí.
      COLECTIVOS_SANDBOX_TASK_WRITE_CONFIRMATION: ${COLECTIVOS_SANDBOX_TASK_WRITE_CONFIRMATION}
      COLECTIVOS_PRODUCTION_TASK_WRITE_CONFIRMATION: ${COLECTIVOS_PRODUCTION_TASK_WRITE_CONFIRMATION}
      COLECTIVOS_SANDBOX_CONTACT_WRITE_CONFIRMATION: ${COLECTIVOS_SANDBOX_CONTACT_WRITE_CONFIRMATION}
      COLECTIVOS_PRODUCTION_CONTACT_WRITE_CONFIRMATION: ${COLECTIVOS_PRODUCTION_CONTACT_WRITE_CONFIRMATION}
      COLECTIVOS_SANDBOX_RISK_WRITE_CONFIRMATION: ${COLECTIVOS_SANDBOX_RISK_WRITE_CONFIRMATION}
      COLECTIVOS_PRODUCTION_RISK_WRITE_CONFIRMATION: ${COLECTIVOS_PRODUCTION_RISK_WRITE_CONFIRMATION}
      COLECTIVOS_SANDBOX_SUBRISK_WRITE_CONFIRMATION: ${COLECTIVOS_SANDBOX_SUBRISK_WRITE_CONFIRMATION}
      COLECTIVOS_PRODUCTION_SUBRISK_WRITE_CONFIRMATION: ${COLECTIVOS_PRODUCTION_SUBRISK_WRITE_CONFIRMATION}
      COLECTIVOS_SANDBOX_ATTACHMENT_WRITE_CONFIRMATION: ${COLECTIVOS_SANDBOX_ATTACHMENT_WRITE_CONFIRMATION}
      COLECTIVOS_PRODUCTION_ATTACHMENT_WRITE_CONFIRMATION: ${COLECTIVOS_PRODUCTION_ATTACHMENT_WRITE_CONFIRMATION}
      # Zoho CRM V8. Sin este bloque ZOHO_ENABLED queda fijo en False (default
      # de settings.py) sin importar lo que se configure en Dokploy: Conciliacion
      # y Colectivos, que consultan Zoho directo, quedarian no funcionales.
      ZOHO_ENABLED: ${ZOHO_ENABLED:-false}
      ZOHO_PUBLIC_SETUP_ENABLED: ${ZOHO_PUBLIC_SETUP_ENABLED:-false}
      ZOHO_ACTIVE_PROFILE: ${ZOHO_ACTIVE_PROFILE:-sandbox}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET}
      ZOHO_REDIRECT_URI: ${ZOHO_REDIRECT_URI:-http://localhost:8000/integrations/zoho/callback/}
      ZOHO_ACCOUNTS_BASE_URL: ${ZOHO_ACCOUNTS_BASE_URL:-https://accounts.zoho.com}
      ZOHO_API_BASE_URL: ${ZOHO_API_BASE_URL:-https://www.zohoapis.com}
      ZOHO_OAUTH_SCOPES: ${ZOHO_OAUTH_SCOPES:-ZohoCRM.org.READ,ZohoCRM.settings.modules.READ,ZohoCRM.settings.fields.READ,ZohoCRM.modules.READ,ZohoCRM.coql.READ}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN}
      ZOHO_REQUEST_TIMEOUT_SECONDS: ${ZOHO_REQUEST_TIMEOUT_SECONDS:-15}
      ZOHO_MAX_RETRIES: ${ZOHO_MAX_RETRIES:-2}
      ZOHO_BACKEND: ${ZOHO_BACKEND:-sdk}
      ZOHO_SDK_RESOURCE_PATH: ${ZOHO_SDK_RESOURCE_PATH:-runtime/zoho_sdk}
      ZOHO_SDK_LOG_LEVEL: ${ZOHO_SDK_LOG_LEVEL:-INFO}
      ZOHO_PRODUCTION_ENABLED: ${ZOHO_PRODUCTION_ENABLED:-false}
      ZOHO_PRODUCTION_CLIENT_ID: ${ZOHO_PRODUCTION_CLIENT_ID}
      ZOHO_PRODUCTION_CLIENT_SECRET: ${ZOHO_PRODUCTION_CLIENT_SECRET}
      ZOHO_PRODUCTION_REFRESH_TOKEN: ${ZOHO_PRODUCTION_REFRESH_TOKEN}
      ZOHO_PRODUCTION_EXPECTED_ORG_ID: ${ZOHO_PRODUCTION_EXPECTED_ORG_ID}
      ZOHO_PRODUCTION_ENVIRONMENT: ${ZOHO_PRODUCTION_ENVIRONMENT:-production}
      ZOHO_PRODUCTION_ACCOUNTS_BASE_URL: ${ZOHO_PRODUCTION_ACCOUNTS_BASE_URL:-https://accounts.zoho.com}
      ZOHO_PRODUCTION_API_BASE_URL: ${ZOHO_PRODUCTION_API_BASE_URL:-https://www.zohoapis.com}
      ZOHO_PRODUCTION_SDK_RESOURCE_PATH: ${ZOHO_PRODUCTION_SDK_RESOURCE_PATH:-runtime/zoho_sdk/production}
      ZOHO_PRODUCTION_WRITE_ENABLED: ${ZOHO_PRODUCTION_WRITE_ENABLED:-false}
      ZOHO_SANDBOX_ENABLED: ${ZOHO_SANDBOX_ENABLED:-false}
      ZOHO_SANDBOX_CLIENT_ID: ${ZOHO_SANDBOX_CLIENT_ID}
      ZOHO_SANDBOX_CLIENT_SECRET: ${ZOHO_SANDBOX_CLIENT_SECRET}
      ZOHO_SANDBOX_REFRESH_TOKEN: ${ZOHO_SANDBOX_REFRESH_TOKEN}
      ZOHO_SANDBOX_EXPECTED_ORG_ID: ${ZOHO_SANDBOX_EXPECTED_ORG_ID}
      ZOHO_SANDBOX_ENVIRONMENT: ${ZOHO_SANDBOX_ENVIRONMENT:-sandbox}
      ZOHO_SANDBOX_ACCOUNTS_BASE_URL: ${ZOHO_SANDBOX_ACCOUNTS_BASE_URL:-https://accounts.zoho.com}
      ZOHO_SANDBOX_API_BASE_URL: ${ZOHO_SANDBOX_API_BASE_URL:-https://sandbox.zohoapis.com}
      ZOHO_SANDBOX_SDK_RESOURCE_PATH: ${ZOHO_SANDBOX_SDK_RESOURCE_PATH:-runtime/zoho_sdk/sandbox}
      ZOHO_SANDBOX_WRITE_ENABLED: ${ZOHO_SANDBOX_WRITE_ENABLED:-false}
    volumes:
      - vault_media:/app/media
    networks:
      - dokploy-network
      - vault-internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - vault_db_data:/var/lib/postgresql/data
    networks:
      - vault-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vault_db_data:
  vault_media:

networks:
  dokploy-network:
    external: true
  vault-internal:

secrets:
  # Token de lectura para clonar el repo privado ays-zoho-sdk durante el
  # build (ver Dockerfile). Se toma de la variable de entorno GH_TOKEN, la
  # misma que ya se configura en Dokploy para el resto de secretos: no crea
  # un mecanismo nuevo, solo la conecta como build secret en vez de runtime.
  gh_token:
    environment: GH_TOKEN
